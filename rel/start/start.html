<!doctype html>
<!--
  Alnasl's start screen. One file, no outside resources: no font, no image, no
  script from anywhere. The launcher (rel/windows/launcher.c, rel/macos/
  Launcher.swift) copies it, with a status file beside it, into the data
  folder and opens the browser on the copy the moment the server process is
  started, so the arbiter sees something in the second after the double-click
  instead of nothing for ten.

  HOW IT KNOWS THE SERVER IS UP - two independent ways, either is enough
    1. start-status.js, beside this file, written by the launcher:
       window.ALNASL_START = {port, first, state, log}. A <script src> from
       one file:// page to its neighbour is allowed in every browser, needs
       no CORS and no permission, and it carries the one thing the page can
       never learn alone: that the server process has died. Re-read every
       second under a new query string (a plain reload would be cached).
    2. A probe of http://localhost:PORT/_ready with fetch(..., {mode:
       'no-cors'}). From a file:// page the answer is opaque, and that is
       all that is needed: any response resolves, a refused connection
       rejects. No CORS headers on the server, nothing to read. An <img> or
       <script> probe would work as well but would log an error for every
       try. If a browser asks "allow this site to reach devices on your
       network" or blocks the probe, way 1 still moves the page on.

  A page served by the app itself would need no trick, but the app is exactly
  what is not there yet. A page served by the launcher on a second port would
  mean a listener in C/Swift, a second port to be busy, and a firewall
  question on a first start. The file is simpler and leaves nothing behind.

  Preview aids (not used by the launchers): ?demo=starting|first|slow|stopped
  freezes one state, ?theme=light|dark forces a scheme.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Alnasl</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1b1b1a; --quiet: #5f5f5c;
    --rule: #dcdcd8; --accent: #7a2e1e; --sunken: #efefec;
    --warn: #744600; --warn-bg: #fcefd2; --bad: #9a1c1c; --bad-bg: #fbe4e1;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a; --panel: #1d1f23; --ink: #e9e9e6; --quiet: #9b9b98;
      --rule: #313339; --accent: #e2a08c; --sunken: #101114;
      --warn: #f3bd60; --warn-bg: #33270e; --bad: #ff9d92; --bad-bg: #3b1815;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a; --panel: #1d1f23; --ink: #e9e9e6; --quiet: #9b9b98;
    --rule: #313339; --accent: #e2a08c; --sunken: #101114;
    --warn: #f3bd60; --warn-bg: #33270e; --bad: #ff9d92; --bad-bg: #3b1815;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font);
    display: grid; place-items: center; padding: 24px;
  }
  main { width: min(440px, 100%); text-align: center; }
  .mark { width: 96px; height: 96px; color: var(--ink); display: block; margin: 0 auto 20px; }
  .mark rect { transform-box: fill-box; transform-origin: center; }
  h1 { font-size: 1.75rem; font-weight: 650; letter-spacing: 0.01em; margin: 0 0 28px; }
  .bar { height: 3px; border-radius: 3px; background: var(--rule); overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 34%; border-radius: 3px; background: var(--accent); }
  .status { margin: 22px 0 0; font-size: 1.05rem; min-height: 1.6em; }
  .more { margin: 8px 0 0; color: var(--quiet); font-size: 0.92rem; min-height: 1.4em; }
  .more code {
    display: block; margin-top: 8px; padding: 8px 10px; border-radius: 6px;
    background: var(--sunken); border: 1px solid var(--rule);
    font: 0.8rem/1.4 var(--mono); color: var(--ink); overflow-wrap: anywhere; user-select: all;
  }
  .more a { color: var(--accent); }

  /* slow: warning tint on the line. stopped: error tint, the bar stops. */
  body[data-state="slow"] .status { color: var(--warn); }
  body[data-state="stopped"] .status { color: var(--bad); font-weight: 600; }
  body[data-state="stopped"] .bar i { width: 100%; background: var(--bad); animation: none; opacity: 1; }
  body[data-state="stopped"] .mark rect { animation: none; opacity: 0.45; }

  /* Motion, only for people who have not asked for less of it. */
  @media (prefers-reduced-motion: no-preference) {
    .bar i { animation: slide 1.9s ease-in-out infinite; }
    .mark rect { animation: breathe 2.8s ease-in-out infinite; }
    .mark rect:nth-child(2) { animation-delay: .15s } .mark rect:nth-child(3) { animation-delay: .3s }
    .mark rect:nth-child(4) { animation-delay: .45s } .mark rect:nth-child(5) { animation-delay: .6s }
    .mark rect:nth-child(6) { animation-delay: .75s } .mark rect:nth-child(7) { animation-delay: .9s }
    main { animation: arrive .5s ease-out both; }
  }
  @keyframes slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(300%) } }
  @keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1) } 50% { opacity: .55; transform: scale(.88) } }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { .bar i { width: 100%; opacity: .35; } body[data-state="stopped"] .bar i { opacity: 1; } }
</style>
</head>
<body data-state="starting">
<main>
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="6" height="6" fill="currentColor"/><rect x="9" y="2" width="6" height="6" fill="currentColor"/><rect x="16" y="2" width="6" height="6" style="fill:var(--accent)"/><rect x="9" y="9" width="6" height="6" fill="currentColor"/><rect x="16" y="9" width="6" height="6" fill="currentColor"/><rect x="2" y="16" width="6" height="6" fill="currentColor"/><rect x="16" y="16" width="6" height="6" fill="currentColor"/></svg>
  <h1>Alnasl</h1>
  <div class="bar" role="progressbar" aria-label="Alnasl"><i></i></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="more" id="more"></p>
</main>
<script>
(function () {
  "use strict";
  var WORDS = {
    en: {
      starting: ["Alnasl is starting\u2026", ""],
      first: ["First start: creating the database\u2026", "This only happens once, and takes longer than usual."],
      slow: ["This is taking unusually long.", "A virus scanner checking a new program can hold things up for a minute. The log says how far it got:"],
      stopped: ["Alnasl stopped before it was ready.", "Close this tab and start Alnasl again. If it keeps happening, the reason is at the end of this log:"],
      ready: ["Ready.", ""],
      link: "Open Alnasl anyway"
    },
    nl: {
      starting: ["Alnasl start\u2026", ""],
      first: ["Eerste start: de database wordt gemaakt\u2026", "Dit gebeurt maar \u00e9\u00e9n keer en duurt langer dan normaal."],
      slow: ["Dit duurt ongewoon lang.", "Een virusscan van een nieuw programma kan een minuut duren. In het logboek staat hoe ver het kwam:"],
      stopped: ["Alnasl is gestopt voordat het klaar was.", "Sluit dit tabblad en start Alnasl opnieuw. Blijft het gebeuren, dan staat de reden aan het einde van dit logboek:"],
      ready: ["Klaar.", ""],
      link: "Alnasl toch openen"
    }
  };
  var SLOW_AFTER_MS = 25000;
  var q = new URLSearchParams(location.search);
  var lang = ((navigator.languages && navigator.languages[0]) || navigator.language || "en")
    .toLowerCase().indexOf("nl") === 0 ? "nl" : "en";
  if (q.get("lang") === "nl" || q.get("lang") === "en") lang = q.get("lang");
  var demo = q.get("demo");
  var theme = q.get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.lang = lang;

  var born = Date.now();
  var port = 4040;
  var fromLauncher = null;
  var left = false;
  var shown = "";

  function appUrl() { return "http://localhost:" + port + "/"; }

  function show(state, log) {
    var w = WORDS[lang][state];
    document.body.setAttribute("data-state", state);
    document.getElementById("status").textContent = w[0];
    var more = document.getElementById("more");
    more.textContent = w[1];
    if (log && (state === "slow" || state === "stopped")) {
      var c = document.createElement("code");
      c.textContent = log;
      more.appendChild(c);
    }
    if (state === "slow" || state === "stopped") {
      var a = document.createElement("a");
      a.href = appUrl();
      a.textContent = WORDS[lang].link;
      var p = document.createElement("div");
      p.style.marginTop = "12px";
      p.appendChild(a);
      more.appendChild(p);
    }
  }

  function render() {
    var s = fromLauncher || {};
    var state;
    if (demo) state = demo;
    else if (s.state === "stopped") state = "stopped";
    else if (Date.now() - born > SLOW_AFTER_MS) state = "slow";
    else state = s.first ? "first" : "starting";
    var log = s.log || (demo ? "C:\\Users\\you\\AppData\\Local\\AlnaslData\\launcher.log" : "");
    var key = state + "|" + log;
    if (key !== shown) { shown = key; show(state, log); }
  }

  function go() {
    if (left || demo) return;
    left = true;
    show("ready");
    location.replace(appUrl());
  }

  // Way 1: the launcher's own word, from the file beside this one.
  function readStatus() {
    var el = document.createElement("script");
    el.src = "start-status.js?t=" + Date.now();
    el.onload = function () {
      if (window.ALNASL_START) {
        fromLauncher = window.ALNASL_START;
        if (fromLauncher.port) port = fromLauncher.port;
        if (fromLauncher.state === "ready") go();
      }
      el.remove();
      render();
    };
    el.onerror = function () { el.remove(); };
    document.head.appendChild(el);
  }

  // Way 2: does anything answer on the port? Opaque is enough.
  function probe() {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 2500);
    fetch("http://localhost:" + port + "/_ready", { mode: "no-cors", cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function () { clearTimeout(timer); go(); })
      .catch(function () { clearTimeout(timer); });
  }

  render();
  if (!demo) {
    readStatus();
    probe();
    setInterval(function () { readStatus(); probe(); render(); }, 1000);
  }
})();
</script>
</body>
</html>
